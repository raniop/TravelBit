<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelins | נסיעות עובדים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
                <div><div class="logo-text">Travel<em>ins</em></div><span class="sidebar-badge" id="companyName">חברה</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">ניהול</div>
                <a href="/dashboard/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>סקירה כללית</a>
                <a href="/dashboard/trips.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>נסיעות עובדים</a>
                <a href="/dashboard/employees.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>ניהול עובדים</a>
                <a href="/dashboard/expenses.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>ניתוח הוצאות</a>
                <a href="/dashboard/workdays.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>ימי עבודה בחו"ל</a>
                <a href="/dashboard/alerts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>התראות ביטוח</a>
                <div class="sidebar-section">ביטוח אופיר</div>
                <a href="/dashboard/bituhofir.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>דשבורד ביטוח</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="userAvatar">C</div>
                    <div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">חברה</div><div class="sidebar-user-role">דשבורד חברה</div></div>
                    <button class="sidebar-logout" onclick="logout()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1>נסיעות עובדים</h1>
                <div class="page-header-actions">
                    <button class="btn btn-primary btn-sm" onclick="openAddTripModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        הוספת נסיעה
                    </button>
                    <button class="btn btn-secondary btn-sm" onclick="exportTrips()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        ייצוא CSV
                    </button>
                </div>
            </div>

            <div class="page-body">
                <div class="filters-bar">
                    <input type="text" class="filter-input" id="filterDest" placeholder="חיפוש יעד..." style="min-width:180px;">
                    <select class="filter-select" id="filterStatus">
                        <option value="">כל הסטטוסים</option>
                        <option value="planned">מתוכנן</option>
                        <option value="active">פעיל</option>
                        <option value="completed">הושלם</option>
                        <option value="cancelled">בוטל</option>
                    </select>
                    <input type="date" class="filter-input" id="filterStart" title="מתאריך">
                    <input type="date" class="filter-input" id="filterEnd" title="עד תאריך">
                    <button class="btn btn-primary btn-sm" onclick="loadTrips()">סנן</button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>רשימת נסיעות</h2>
                        <span id="tripCount" style="font-size:13px; color:var(--gray-500);"></span>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>עובד</th>
                                    <th>מחלקה</th>
                                    <th>יעד</th>
                                    <th>יציאה</th>
                                    <th>חזרה</th>
                                    <th>משך (ימים)</th>
                                    <th>ימי עבודה</th>
                                    <th>עלות</th>
                                    <th>סטטוס</th>
                                    <th>פעולות</th>
                                </tr>
                            </thead>
                            <tbody id="tripsTable">
                                <tr><td colspan="10" class="loading"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" style="display:flex; justify-content:center; gap:8px; margin-top:16px;"></div>
            </div>
        </main>
    </div>

    <!-- Trip Modal (Add / Edit) -->
    <div class="modal-overlay" id="tripModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="tripModalTitle">הוספת נסיעה חדשה</h2>
                <button class="modal-close" onclick="closeTripModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="tripForm">
                    <div class="form-group">
                        <label>עובד *</label>
                        <select id="tripEmployee" class="filter-select" style="width:100%;" required>
                            <option value="">-- בחר עובד --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>יעד *</label>
                        <input type="text" name="destination" required placeholder="לדוגמה: לונדון, אנגליה">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div class="form-group">
                            <label>תאריך יציאה *</label>
                            <input type="date" name="departureDate" required>
                        </div>
                        <div class="form-group">
                            <label>תאריך חזרה *</label>
                            <input type="date" name="returnDate" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>מטרת הנסיעה</label>
                        <input type="text" name="purpose" placeholder="לדוגמה: כנס, פגישת לקוח">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div class="form-group">
                            <label>סטטוס</label>
                            <select name="status" class="filter-select" style="width:100%;">
                                <option value="planned">מתוכנן</option>
                                <option value="active">פעיל</option>
                                <option value="completed">הושלם</option>
                                <option value="cancelled">בוטל</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>ימי עבודה בחו"ל</label>
                            <input type="number" name="workdaysAbroad" min="0" placeholder="0">
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns:2fr 1fr; gap:12px;">
                        <div class="form-group">
                            <label>עלות</label>
                            <input type="number" name="cost" min="0" step="0.01" placeholder="0" style="direction:ltr; text-align:left;">
                        </div>
                        <div class="form-group">
                            <label>מטבע</label>
                            <select name="currency" class="filter-select" style="width:100%;">
                                <option value="ILS">ILS ₪</option>
                                <option value="USD">USD $</option>
                                <option value="EUR">EUR €</option>
                                <option value="GBP">GBP £</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>הערות</label>
                        <textarea name="notes" rows="2" style="width:100%; padding:8px; border:1px solid var(--gray-200); border-radius:8px; font-family:inherit; resize:vertical;"></textarea>
                    </div>
                    <div class="login-error" id="tripModalError"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary btn-sm" id="tripSubmitBtn" onclick="submitTrip()">הוספת נסיעה</button>
                <button class="btn btn-secondary btn-sm" onclick="closeTripModal()">ביטול</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/trips.js"></script>
</body>
</html>
