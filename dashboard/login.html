<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelins | כניסת חברה</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            </div>
            <span class="logo-text">Travel<em>ins</em></span>
        </div>
        <p class="login-subtitle">דשבורד חברה</p>

        <h2>כניסה לדשבורד</h2>
        <p class="login-subtitle">הזן את פרטי ההתחברות שקיבלת</p>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">שם משתמש</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="הזן שם משתמש">
            </div>
            <div class="form-group">
                <label for="password">סיסמה</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="הזן סיסמה">
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">כניסה</button>
        </form>

        <p style="margin-top: 24px; font-size: 13px; color: var(--gray-400);">
            <a href="/" style="color: var(--primary); text-decoration: none;">חזרה לאתר הראשי</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
